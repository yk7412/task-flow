name: 自动部署前端项目到 VPS

on:
  push:
    branches: [ master ]

# 🚀 新增全局环境变量：按警告提示，显式告知 GitHub 底层直接强制使用 Node 24 引擎跑脚本
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 升级 checkout 动作到 v4（官方 v4 最新子版本已兼容 Node 24 运行时环境）
      - name: 检出代码 (Checkout)
        uses: actions/checkout@v4

      # 2. 升级 setup-node 动作版本，并将项目构建 Node 对齐本地的 24 版本
      - name: 配置 Node.js
        uses: actions/setup-node@v4 # 官方 setup-node@v4 原生完美支持输出 Node 24
        with:
          node-version: '24'        # 👉 从 20 修改为 24，完美对齐本地开发环境

      - name: 安装依赖
        run: npm install

      - name: 项目打包构建
        run: npm run build

      - name: 部署产物到服务器
        uses: easingthemes/ssh-deploy@main
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          ARGS: "-avzr --delete"
          SOURCE: "dist/"
          REMOTE_HOST: ${{ secrets.VPS_HOST }}
          REMOTE_USER: ${{ secrets.VPS_USERNAME }}
          TARGET: "/var/www/my-frontend"